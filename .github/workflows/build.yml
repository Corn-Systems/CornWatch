name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CornWatch.sln -c Release

      - name: Test
        run: dotnet test CornWatch.sln -c Release --no-build

      - name: Publish
        run: dotnet publish CornWatch/CornWatch.csproj -c Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CornWatch
          path: CornWatch/bin/Release/net10.0-windows/win-x64/publish/
